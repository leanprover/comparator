name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: comparator

      - uses: actions/checkout@v4
        with:
          repository: leanprover/lean4export
          path: lean4export

      - uses: actions/checkout@v4
        with:
          repository: Zouuup/landrun
          path: landrun

      - uses: actions/checkout@v4
        with:
          repository: ammkrn/nanoda_lib
          path: nanoda

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build landrun
        working-directory: landrun
        run: go build -o landrun cmd/landrun/main.go

      - name: Build nanoda
        working-directory: nanoda
        run: cargo build --release

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: comparator

      - name: Build lean4export
        working-directory: lean4export
        run: lake build

      - name: Test informative strict-mode failure
        working-directory: comparator
        run: |
          if COMPARATOR_UNSHARE=/bin/false .lake/build/bin/comparator tests/projects/fail_closed_match/config.json >namespace-error.log 2>&1; then
            echo "Strict namespace preflight unexpectedly succeeded."
            exit 1
          fi
          grep -F "util-linux" namespace-error.log
          grep -F "no workload command was started" namespace-error.log

      - name: Enable unprivileged user namespaces
        run: |
          if [[ -e /proc/sys/user/max_user_namespaces ]] &&
             [[ "$(sysctl -n user.max_user_namespaces)" == 0 ]]; then
            sudo sysctl -w user.max_user_namespaces=15000
          fi
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run comparator tests
        working-directory: comparator
        run: |
          export PATH="$GITHUB_WORKSPACE/nanoda/target/release:$GITHUB_WORKSPACE/lean4export/.lake/build/bin:$GITHUB_WORKSPACE/landrun:$PATH"
          lean --run runtests.lean
