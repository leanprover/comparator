name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: comparator

      - uses: actions/checkout@v4
        with:
          repository: leanprover/lean4export
          path: lean4export

      - uses: actions/checkout@v4
        with:
          repository: Zouuup/landrun
          path: landrun

      - uses: actions/checkout@v4
        with:
          repository: ammkrn/nanoda_lib
          path: nanoda

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build landrun
        working-directory: landrun
        run: go build -o landrun cmd/landrun/main.go

      - name: Build nanoda
        working-directory: nanoda
        run: cargo build --release

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: comparator

      - name: Build lean4export
        working-directory: lean4export
        run: lake build

      - name: Run comparator tests
        working-directory: comparator
        run: |
          export PATH="$GITHUB_WORKSPACE/nanoda/target/release:$GITHUB_WORKSPACE/lean4export/.lake/build/bin:$GITHUB_WORKSPACE/landrun:$PATH"
          lean --run runtests.lean

      - name: Test sandbox environment propagation
        working-directory: comparator
        run: |
          lake env bash -eu -c '
            export LEAN_PATH="$PWD/.lake/build/lib/lean:$LEAN_PATH"
            LEAN_NUM_THREADS=1 lean tests/SandboxEnv.lean
            LEAN_NUM_THREADS=3 lean tests/SandboxEnv.lean
            env -u LEAN_NUM_THREADS lean tests/SandboxEnv.lean
          '
